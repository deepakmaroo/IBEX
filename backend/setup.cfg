[flake8]
ignore =
    # 2 blank lines
    E302,
    # line break before binary operator
    W503,
    # space before :
    E203,
    # elipsis operator in the same line as class declaration
    E701,
    # elipsis operator in the same line as abstract function definition
    E704,
exclude =
    .eggs
    docs
max-line-length = 120